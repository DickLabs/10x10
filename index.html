<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>TENGRID</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#12181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TenGrid">
<style>
  :root{
    --ink:#eef0e8;
    --paper:#12181f;
    --paper-2:#1a2229;
    --grid-line:#3b4b5a;
    --accent:#fffd82;
    --muted:#7c8894;
    --danger:#d6564a;
    --ok:#4caf7d;
    --cell: 32px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 10%, #1c2a35 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a2431 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 60px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    min-height:100%;
  }
  header{
    position:relative;
    display:flex; flex-direction:column; gap:8px;
    width:100%; max-width:420px; margin-bottom:18px;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:700; letter-spacing:6px;
    font-size:26px; margin:0; color:var(--ink);
    position:relative;
  }
  h1 span{color:var(--accent);}
  #revTrigger{ cursor:pointer; }
  #revPopup{
    display:none;
    position:absolute; top:100%; left:0; margin-top:6px;
    background:var(--paper-2); border:1px solid var(--grid-line); border-radius:4px;
    padding:6px 10px; font-size:11px; letter-spacing:1px; color:var(--muted);
    white-space:nowrap; z-index:20;
  }
  #revPopup.show{ display:block; }
  .scorebox{
    text-align:center; font-size:14px; color:var(--muted);
    letter-spacing:2px; text-transform:uppercase;
  }
  .scorebox .num{
    display:block; font-size:25px; color:var(--accent);
    font-family: Georgia, serif; letter-spacing:0px; line-height:1.1;
    font-variant-numeric: lining-nums;
  }
  .scorebox-current .num{
    font-size:30px;
  }
  #board{
    position:relative;
    box-sizing:content-box;
    width:calc(var(--cell) * 10);
    height:calc(var(--cell) * 10);
    background: var(--paper-2);
    border:2px solid var(--grid-line);
    box-shadow: 0 0 0 6px var(--paper), 0 12px 30px rgba(0,0,0,0.45);
    border-radius:4px;
  }
  .cell{
    position:absolute;
    width:var(--cell); height:var(--cell);
    box-sizing:border-box;
    border-right:1px solid var(--grid-line);
    border-bottom:1px solid var(--grid-line);
  }
  .cell.filled{
    background:var(--accent);
    border-style:solid;
    border-width:1px;
    border-top-color:rgba(255,255,255,0.45);
    border-left-color:rgba(255,255,255,0.45);
    border-right-color:rgba(20,26,33,0.65);
    border-bottom-color:rgba(20,26,33,0.65);
  }
  .cell.preview-ok{
    background:rgba(76,175,125,0.35) !important;
    box-shadow: inset 0 0 0 2px var(--ok);
  }
  .cell.preview-bad{
    background:rgba(214,86,74,0.30) !important;
    box-shadow: inset 0 0 0 2px var(--danger);
  }
  .cell.clearing{
    animation: flash 0.32s ease-out forwards;
  }
  @keyframes flash{
    0%{ filter:brightness(2.4); transform:scale(1); opacity:1;}
    100%{ filter:brightness(2.4); transform:scale(0.4); opacity:0;}
  }

  #tray{
    display:flex; gap:14px; margin-top:26px;
    width:100%; max-width:420px; justify-content:center;
  }
  .slot{
    width:112px; height:112px;
    background:var(--paper-2);
    border:1px solid var(--grid-line);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    cursor:grab;
    touch-action:none;
  }
  .slot.empty{ opacity:0.25; cursor:default; }
  .slot.dragging-source{ opacity:0; }
  .piece-grid{ position:relative; }
  .piece-grid .cell{ position:absolute; }

  #status{
    display:none;
    margin-top:18px; min-height:20px;
    font-size:12px; letter-spacing:1px; color:var(--muted);
    text-transform:uppercase;
  }
  #revline{
    display:none;
    margin-top:10px; opacity:0.6; letter-spacing:1px;
    font-size:11px; color:var(--muted); text-align:center;
  }

  #ghost{
    position:fixed; top:0; left:0; pointer-events:none; z-index:50;
    opacity:0.9;
    will-change:transform;
  }
  #ghost .cell{ position:absolute; }

  #overlay{
    position:fixed; inset:0; background:rgba(10,14,18,0.86);
    display:none; align-items:center; justify-content:center; z-index:100;
    flex-direction:column; gap:14px;
  }
  #overlay.show{ display:flex; }
  #overlay .msg{ font-family:Georgia,serif; font-size:30px; letter-spacing:2px; color:var(--accent); }
  #overlay .sub{
    color:var(--accent); font-size:26px; letter-spacing:1px;
    text-align:center; padding:0 24px; max-width:340px; line-height:1.3;
  }
  #overlay button{
    margin-top:10px;
    background:var(--accent); color:#1a1408; border:none;
    font-family:inherit; font-weight:700; letter-spacing:2px;
    padding:10px 22px; border-radius:4px; cursor:pointer; font-size:13px;
    text-transform:uppercase;
  }

  footer{
    margin-top:22px; font-size:11px; color:var(--muted); text-align:center; max-width:360px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TEN<span>G<span id="revTrigger">R</span>ID</span><div id="revPopup"></div></h1>
    <div style="display:flex; justify-content:space-between; width:100%;">
      <div class="scorebox">BEST<span class="num" id="bestNum">0</span></div>
      <div class="scorebox">WORST<span class="num" id="worstNum">—</span></div>
      <div class="scorebox">LETHALITY<span class="num" id="lethNum">0%</span></div>
      <div class="scorebox">PEAK<span class="num" id="peakNum">0</span></div>
    </div>
    <div class="scorebox scorebox-current">SCORE<span class="num" id="scoreNum">0</span></div>
  </header>

  <div id="board"></div>

  <div id="tray">
    <div class="slot" id="slot0"><div class="piece-grid" id="piece0"></div></div>
    <div class="slot" id="slot1"><div class="piece-grid" id="piece1"></div></div>
    <div class="slot" id="slot2"><div class="piece-grid" id="piece2"></div></div>
  </div>

  <div id="status">Drag a piece onto the grid</div>
  <div id="revline">rev: 2026-08-23 08:40 PM EDT</div>
</div>

<div id="ghost"></div>

<div id="overlay">
  <div class="msg">NO MOVES LEFT</div>
  <div class="sub" id="finalScore"></div>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(function(){
  const CELL = 32;

  // Set to true to re-enable the green/red drop-preview highlighting while dragging.
  // It costs a little extra DOM work per drag frame, which can cause lag on older
  // devices — set to false to skip it (placement/scoring logic is unaffected either way).
  const SHOW_PLACEMENT_PREVIEW = false;

  // How much further the piece moves than your finger actually does, scaled from
  // the drag's starting point. 1 = normal 1:1 tracking. Useful for reaching corners
  // of the board with a short thumb reach without moving the whole hand.
  const DRAG_AMPLIFY = 1.3;
  const BOARD_N = 10;

  const BLOCK_COLOR = '#fffd82';

  const SHAPES = [
    {name:'full',      cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]},
    {name:'square2',   cells:[[0,0],[0,1],[1,0],[1,1]]},
    {name:'bigL-BL',   cells:[[0,0],[1,0],[2,0],[2,1],[2,2]]},
    {name:'bigL-BR',   cells:[[0,2],[1,2],[2,0],[2,1],[2,2]]},
    {name:'bigL-TR',   cells:[[0,0],[0,1],[0,2],[1,2],[2,2]]},
    {name:'bigL-TL',   cells:[[0,0],[0,1],[0,2],[1,0],[2,0]]},
    {name:'smallL-0',  cells:[[0,0],[1,0],[1,1]]},
    {name:'smallL-90', cells:[[0,0],[0,1],[1,0]]},
    {name:'smallL-180',cells:[[0,0],[0,1],[1,1]]},
    {name:'smallL-270',cells:[[0,1],[1,0],[1,1]]},
    {name:'line1',     cells:[[0,0]]},
    {name:'line2-h',   cells:[[0,0],[0,1]]},
    {name:'line2-v',   cells:[[0,0],[1,0]]},
    {name:'line3-h',   cells:[[0,0],[0,1],[0,2]]},
    {name:'line3-v',   cells:[[0,0],[1,0],[2,0]]},
    {name:'line4-h',   cells:[[0,0],[0,1],[0,2],[0,3]]},
    {name:'line4-v',   cells:[[0,0],[1,0],[2,0],[3,0]]},
    {name:'line5-h',   cells:[[0,0],[0,1],[0,2],[0,3],[0,4]]},
    {name:'line5-v',   cells:[[0,0],[1,0],[2,0],[3,0],[4,0]]},
  ].map(s=>{
    const rows = Math.max(...s.cells.map(c=>c[0]))+1;
    const cols = Math.max(...s.cells.map(c=>c[1]))+1;
    return {...s, rows, cols};
  });

  function randShape(){
    const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
    return {...s, color: BLOCK_COLOR};
  }

  // board state: null or color string
  let board = Array.from({length:BOARD_N}, ()=>Array(BOARD_N).fill(null));
  let score = 0;
  let highScore = 0;
  let worstScore = null;
  let peakBlocks = 0;
  let totalPlacements = 0;
  let clearingPlacements = 0;
  let tray = [randShape(), randShape(), randShape()];
  let gameOver = false;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('scoreNum');
  const bestEl = document.getElementById('bestNum');
  const worstEl = document.getElementById('worstNum');
  const peakEl = document.getElementById('peakNum');
  const lethEl = document.getElementById('lethNum');
  const statusEl = document.getElementById('status');
  const ghostEl = document.getElementById('ghost');
  const overlayEl = document.getElementById('overlay');

  const boardCellEls = Array.from({length:BOARD_N}, ()=>Array(BOARD_N).fill(null));

  function initBoardDom(){
    boardEl.innerHTML='';
    for(let r=0;r<BOARD_N;r++){
      for(let c=0;c<BOARD_N;c++){
        const d = document.createElement('div');
        d.className='cell';
        d.style.left = (c*CELL)+'px';
        d.style.top = (r*CELL)+'px';
        boardEl.appendChild(d);
        boardCellEls[r][c]=d;
      }
    }
  }

  function renderBoard(){
    for(let r=0;r<BOARD_N;r++){
      for(let c=0;c<BOARD_N;c++){
        const el = boardCellEls[r][c];
        el.classList.toggle('filled', !!board[r][c]);
      }
    }
  }

  function renderPieceGrid(container, shape, cellSize){
    container.innerHTML='';
    container.style.width = (shape.cols*cellSize)+'px';
    container.style.height = (shape.rows*cellSize)+'px';
    const frag = document.createDocumentFragment();
    shape.cells.forEach(([r,c])=>{
      const d = document.createElement('div');
      d.className='cell filled';
      d.style.width = cellSize+'px';
      d.style.height = cellSize+'px';
      d.style.left = (c*cellSize)+'px';
      d.style.top = (r*cellSize)+'px';
      frag.appendChild(d);
    });
    container.appendChild(frag);
  }

  function renderTray(){
    for(let i=0;i<3;i++){
      const slot = document.getElementById('slot'+i);
      const grid = document.getElementById('piece'+i);
      if(!tray[i]){
        slot.classList.add('empty');
        grid.innerHTML='';
      } else {
        slot.classList.remove('empty');
        renderPieceGrid(grid, tray[i], 22);
      }
    }
  }

  function isValidPlacement(shape, rowStart, colStart){
    for(const [dr,dc] of shape.cells){
      const r = rowStart+dr, c = colStart+dc;
      if(r<0||r>=BOARD_N||c<0||c>=BOARD_N) return false;
      if(board[r][c]) return false;
    }
    return true;
  }

  function canPlaceAnywhere(shape){
    for(let r=0;r<BOARD_N;r++){
      for(let c=0;c<BOARD_N;c++){
        if(isValidPlacement(shape,r,c)) return true;
      }
    }
    return false;
  }

  function checkGameOver(){
    const anyPlaceable = tray.some(s=>s && canPlaceAnywhere(s));
    if(!anyPlaceable){
      gameOver = true;
      maybeSaveWorstScore(score);
      document.getElementById('finalScore').innerHTML =
        'Final score: '+score+'<br>'+(score>=highScore && score>0 ? 'New best!' : 'Best: '+highScore);
      overlayEl.classList.add('show');
    }
  }

  function commitPlacement(pieceIndex, shape, rowStart, colStart){
    shape.cells.forEach(([dr,dc])=>{
      board[rowStart+dr][colStart+dc] = shape.color;
    });

    // points for successfully placing a piece: one point per cell it occupies
    score += shape.cells.length;
    scoreEl.textContent = score;

    totalPlacements++;

    // peak occupancy is measured right after the piece lands, before any clear removes cells
    let filledCount = 0;
    for(let r=0;r<BOARD_N;r++) for(let c=0;c<BOARD_N;c++) if(board[r][c]) filledCount++;
    maybeSavePeakBlocks(filledCount);

    // find full rows/cols
    const cellsToClear = new Set();
    for(let r=0;r<BOARD_N;r++){
      if(board[r].every(v=>v)){
        for(let c=0;c<BOARD_N;c++) cellsToClear.add(r+','+c);
      }
    }
    for(let c=0;c<BOARD_N;c++){
      let full = true;
      for(let r=0;r<BOARD_N;r++) if(!board[r][c]){full=false;break;}
      if(full){
        for(let r=0;r<BOARD_N;r++) cellsToClear.add(r+','+c);
      }
    }

    if(cellsToClear.size>0) clearingPlacements++;
    lethEl.textContent = Math.round((clearingPlacements/totalPlacements)*100)+'%';

    renderBoard();

    // Remove the used piece from the tray immediately — this must not wait for
    // the clear animation, or the piece appears to linger/reappear in its slot
    // while the board is still animating the clear.
    tray[pieceIndex] = null;
    if(tray.every(s=>s===null)){
      tray = [randShape(), randShape(), randShape()];
    }
    renderTray();

    if(cellsToClear.size>0){
      // will this clear leave the entire board empty?
      let boardWillBeEmpty = true;
      for(let r=0;r<BOARD_N && boardWillBeEmpty;r++){
        for(let c=0;c<BOARD_N;c++){
          if(board[r][c] && !cellsToClear.has(r+','+c)){
            boardWillBeEmpty = false;
            break;
          }
        }
      }

      cellsToClear.forEach(key=>{
        const [r,c] = key.split(',').map(Number);
        boardCellEls[r][c].classList.add('clearing');
      });
      score += cellsToClear.size;
      let statusMsg = cellsToClear.size+' blocks cleared';
      if(cellsToClear.size>=40){
        score += 123;
        statusMsg += ' • +123 bonus!';
      }
      if(boardWillBeEmpty){
        score += 123;
        statusMsg += ' • Board Clear! +123!';
      }
      scoreEl.textContent = score;
      statusEl.textContent = statusMsg;
      maybeSaveHighScore();
      setTimeout(()=>{
        cellsToClear.forEach(key=>{
          const [r,c] = key.split(',').map(Number);
          board[r][c]=null;
          boardCellEls[r][c].classList.remove('clearing');
        });
        renderBoard();
        checkGameOver(); // board now reflects the clear — safe to check for game over
      }, 320);
    } else {
      statusEl.textContent = 'Placed';
      maybeSaveHighScore();
      checkGameOver();
    }
  }

  function setCookie(name, value){
    const expires = new Date(Date.now() + 3650*864e5).toUTCString(); // ~10 years
    document.cookie = name+'='+encodeURIComponent(value)+'; expires='+expires+'; path=/; SameSite=Lax';
  }
  function getCookie(name){
    const match = document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  async function loadHighScore(){
    try{
      const v = localStorage.getItem('tengrid_highscore') || getCookie('tengrid_highscore');
      highScore = v ? parseInt(v,10)||0 : 0;
    }catch(e){
      highScore = parseInt(getCookie('tengrid_highscore'),10) || 0;
    }
    bestEl.textContent = highScore;
  }

  async function maybeSaveHighScore(){
    if(score>highScore){
      highScore = score;
      bestEl.textContent = highScore;
      try{ localStorage.setItem('tengrid_highscore', String(highScore)); }catch(e){}
      try{ setCookie('tengrid_highscore', String(highScore)); }catch(e){}
    }
  }

  async function loadWorstScore(){
    try{
      const v = localStorage.getItem('tengrid_worstscore') || getCookie('tengrid_worstscore');
      worstScore = v ? parseInt(v,10) : null;
    }catch(e){
      const v = getCookie('tengrid_worstscore');
      worstScore = v ? parseInt(v,10) : null;
    }
    worstEl.textContent = worstScore===null ? '—' : worstScore;
  }

  async function maybeSaveWorstScore(finalScore){
    if(worstScore===null || finalScore<worstScore){
      worstScore = finalScore;
      worstEl.textContent = worstScore;
      try{ localStorage.setItem('tengrid_worstscore', String(worstScore)); }catch(e){}
      try{ setCookie('tengrid_worstscore', String(worstScore)); }catch(e){}
    }
  }

  async function loadPeakBlocks(){
    try{
      const v = localStorage.getItem('tengrid_peakblocks') || getCookie('tengrid_peakblocks');
      peakBlocks = v ? parseInt(v,10)||0 : 0;
    }catch(e){
      peakBlocks = parseInt(getCookie('tengrid_peakblocks'),10) || 0;
    }
    peakEl.textContent = peakBlocks;
  }

  async function maybeSavePeakBlocks(currentFilled){
    if(currentFilled>peakBlocks){
      peakBlocks = currentFilled;
      peakEl.textContent = peakBlocks;
      try{ localStorage.setItem('tengrid_peakblocks', String(peakBlocks)); }catch(e){}
      try{ setCookie('tengrid_peakblocks', String(peakBlocks)); }catch(e){}
    }
  }

  // ---- Drag logic ----
  let drag = null; // {index, shape, grabOffsetX, grabOffsetY}
  let prevPreviewCells = []; // [{r,c}] currently highlighted, so we only touch what changed

  function clearPreview(){
    prevPreviewCells.forEach(({r,c})=>{
      boardCellEls[r][c].classList.remove('preview-ok','preview-bad');
    });
    prevPreviewCells = [];
  }

  function showPreview(shape, rowStart, colStart){
    const valid = isValidPlacement(shape, rowStart, colStart);
    const cls = valid ? 'preview-ok' : 'preview-bad';

    const nextCells = [];
    shape.cells.forEach(([dr,dc])=>{
      const r=rowStart+dr, c=colStart+dc;
      if(r>=0&&r<BOARD_N&&c>=0&&c<BOARD_N) nextCells.push({r,c});
    });

    // remove highlight from cells no longer covered
    prevPreviewCells.forEach(({r,c})=>{
      if(!nextCells.some(n=>n.r===r&&n.c===c)){
        boardCellEls[r][c].classList.remove('preview-ok','preview-bad');
      }
    });
    // add/update highlight for current cells
    nextCells.forEach(({r,c})=>{
      const el = boardCellEls[r][c];
      el.classList.remove('preview-ok','preview-bad');
      el.classList.add(cls);
    });

    prevPreviewCells = nextCells;
    return valid;
  }

  function startDrag(e, index){
    if(gameOver || drag) return;
    const shape = tray[index];
    if(!shape) return;
    const slot = document.getElementById('slot'+index);
    const grid = document.getElementById('piece'+index);
    const gridRect = grid.getBoundingClientRect();

    // scale factor between tray render (22px) and board cell (CELL)
    const scale = CELL/22;

    // On touch, lift the piece well above the finger so it isn't hidden underneath.
    // Mouse users can already see the cursor, so no lift needed there.
    const lift = (e.pointerType === 'touch') ? CELL*2.6 : 0;

    drag = {
      index, shape,
      grabOffsetX: (e.clientX - gridRect.left)*scale,
      grabOffsetY: (e.clientY - gridRect.top)*scale,
      lift,
      startClientX: e.clientX,
      startClientY: e.clientY,
      lastRow: null, lastCol: null, lastValid:false,
      pendingX: e.clientX, pendingY: e.clientY,
      rafScheduled: false
    };

    slot.classList.add('dragging-source');
    renderPieceGrid(ghostEl, shape, CELL);
    ghostEl.style.display='block';
    positionGhost(e.clientX, e.clientY);
    processDragFrame();

    document.addEventListener('pointermove', onDragMove, {passive:true});
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
  }

  function positionGhost(x,y){
    ghostEl.style.transform = `translate3d(${x - drag.grabOffsetX}px, ${y - drag.grabOffsetY - drag.lift}px, 0)`;
  }

  function onDragMove(e){
    if(!drag) return;
    drag.pendingX = e.clientX;
    drag.pendingY = e.clientY;
    if(!drag.rafScheduled){
      drag.rafScheduled = true;
      requestAnimationFrame(processDragFrame);
    }
  }

  function processDragFrame(){
    if(!drag) return;
    drag.rafScheduled = false;

    // amplify motion relative to the drag's starting point, not the raw pointer position
    const x = drag.startClientX + (drag.pendingX - drag.startClientX) * DRAG_AMPLIFY;
    const y = drag.startClientY + (drag.pendingY - drag.startClientY) * DRAG_AMPLIFY;
    positionGhost(x,y);

    const boardRect = boardEl.getBoundingClientRect();
    const colStart = Math.round((x - drag.grabOffsetX - boardRect.left)/CELL);
    const rowStart = Math.round((y - drag.grabOffsetY - drag.lift - boardRect.top)/CELL);

    if(rowStart===drag.lastRow && colStart===drag.lastCol) return; // same cell as last frame — nothing to recompute

    drag.lastRow = rowStart; drag.lastCol = colStart;
    if(SHOW_PLACEMENT_PREVIEW){
      drag.lastValid = showPreview(drag.shape, rowStart, colStart);
    } else {
      drag.lastValid = isValidPlacement(drag.shape, rowStart, colStart);
    }
  }

  function onDragEnd(e){
    if(!drag) return;
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);

    const slot = document.getElementById('slot'+drag.index);
    slot.classList.remove('dragging-source');
    ghostEl.style.display='none';
    clearPreview();

    if(drag.lastValid){
      commitPlacement(drag.index, drag.shape, drag.lastRow, drag.lastCol);
    } else {
      statusEl.textContent = 'Can\'t place there';
    }
    drag = null;
  }

  function attachTrayHandlers(){
    for(let i=0;i<3;i++){
      const slot = document.getElementById('slot'+i);
      slot.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        startDrag(e, i);
      });
    }
  }

  function restart(){
    board = Array.from({length:BOARD_N}, ()=>Array(BOARD_N).fill(null));
    score = 0;
    scoreEl.textContent = '0';
    bestEl.textContent = highScore;
    worstEl.textContent = worstScore===null ? '—' : worstScore;
    peakEl.textContent = peakBlocks;
    totalPlacements = 0;
    clearingPlacements = 0;
    lethEl.textContent = '0%';
    tray = [randShape(), randShape(), randShape()];
    gameOver = false;
    overlayEl.classList.remove('show');
    statusEl.textContent = 'Drag a piece onto the grid';
    renderBoard();
    renderTray();
  }

  document.getElementById('restartBtn').addEventListener('click', restart);

  initBoardDom();
  renderBoard();
  renderTray();
  attachTrayHandlers();
  loadHighScore();
  loadWorstScore();
  loadPeakBlocks();

  // R in the title reveals the current revision code — mirrors the revline
  // text at the bottom of the page so there's only one place to update it.
  (function(){
    const trigger = document.getElementById('revTrigger');
    const popup = document.getElementById('revPopup');
    const revline = document.getElementById('revline');
    popup.textContent = revline.textContent;
    trigger.addEventListener('click', (e)=>{
      e.stopPropagation();
      popup.classList.toggle('show');
    });
    document.addEventListener('click', (e)=>{
      if(popup.classList.contains('show') && !popup.contains(e.target) && e.target!==trigger){
        popup.classList.remove('show');
      }
    });
  })();

  // Actively clean up any service worker registered by an earlier PWA build of this
  // page on this device, so it can never intercept future loads with stale cached content.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(reg=>reg.unregister());
    }).catch(()=>{});
    if(window.caches && caches.keys){
      caches.keys().then(keys=>{
        keys.forEach(key=>caches.delete(key));
      }).catch(()=>{});
    }
  }
})();
</script>
</body>
</html>
